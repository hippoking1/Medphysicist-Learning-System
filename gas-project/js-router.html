<script>
/**
 * 前端 SPA Hash-Based 路由器 (js-router.html)
 */

const Routes = {
  'dashboard': { template: 'template-dashboard', loaderName: 'loadDashboardPage' },
  'syllabus': { template: 'template-syllabus', loaderName: 'loadSyllabusPage' },
  'practice': { template: 'template-practice', loaderName: 'loadPracticePage' },
  'exam': { template: 'template-exam', loaderName: 'loadExamPage' },
  'review': { template: 'template-review', loaderName: 'loadReviewPage' },
  'oral': { template: 'template-oral', loaderName: 'loadOralPage' },
  'journal': { template: 'template-journal', loaderName: 'loadJournalPage' },
  'settings': { template: 'template-settings', loaderName: 'loadSettingsPage' }
};

async function router() {
  const hash = window.location.hash.substring(1) || 'dashboard';
  const route = Routes[hash] || Routes['dashboard'];
  
  // 1. 更新側邊欄 Active 狀態
  const navItems = document.querySelectorAll('.nav-item');
  navItems.forEach(item => {
    if (item.getAttribute('data-page') === hash) {
      item.classList.add('active');
    } else {
      item.classList.remove('active');
    }
  });
  
  // 2. 顯示讀取中動畫
  const appView = document.getElementById('app-view');
  appView.innerHTML = `
    <div class="loader-container">
      <div class="spinner"></div>
      <div class="loading-text">正在載入資料...</div>
    </div>
  `;
  
  // 3. 複製對應樣板並渲染
  try {
    const template = document.getElementById(route.template);
    if (!template) {
      appView.innerHTML = `<div class="glass-card"><h3>頁面建構中</h3><p>頁面模板 ${route.template} 遺失。</p></div>`;
      return;
    }
    appView.innerHTML = '';
    appView.appendChild(template.content.cloneNode(true));
    
    // 4. 執行對應頁面的資料載入與邏輯綁定
    const loaderFunc = window[route.loaderName];
    if (loaderFunc && typeof loaderFunc === 'function') {
      await loaderFunc();
    } else {
      console.warn(`未找到頁面載入器: ${route.loaderName}`);
    }
    
    // 5. 重新進行公式排版
    renderMath();
  } catch (err) {
    console.error(err);
    appView.innerHTML = `
      <div class="glass-card" style="border-color: var(--danger);">
        <h3 style="color: var(--danger);">資料載入失敗</h3>
        <p>${err.message}</p>
        <button class="btn btn-primary" onclick="router()" style="margin-top: 1rem;">重新嘗試</button>
      </div>
    `;
  }
}

// 監聽路由變化與網頁初始化
window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', () => {
  // 初次載入，若無 hash 則給予 #dashboard
  if (!window.location.hash) {
    window.location.hash = '#dashboard';
  } else {
    router();
  }
});

// ==========================================
// 全局通用下拉選單聯動工具函式
// ==========================================
function utilsUpdateTopicSelect(modSelectId, topicSelectId, syllabus) {
  const mId = document.getElementById(modSelectId).value;
  const topicSelect = document.getElementById(topicSelectId);
  topicSelect.innerHTML = '';
  
  const topics = [];
  const added = new Set();
  
  syllabus.forEach(u => {
    if ((mId === 'ALL' || u.moduleId === mId) && !added.has(u.topicId)) {
      topics.push({ id: u.topicId, name: u.topicName });
      added.add(u.topicId);
    }
  });
  
  topics.forEach(t => {
    topicSelect.add(new Option(`[${t.id}] ${t.name}`, t.id));
  });
}

function utilsUpdateUnitSelect(modSelectId, topicSelectId, unitSelectId, syllabus, options = {}) {
  const mId = document.getElementById(modSelectId).value;
  const tId = topicSelectId ? document.getElementById(topicSelectId).value : null;
  const unitSelect = document.getElementById(unitSelectId);
  unitSelect.innerHTML = '';
  
  if (options.allOptionText) {
    unitSelect.add(new Option(options.allOptionText, options.allOptionValue || ''));
  }
  
  const seenUnits = new Set();
  syllabus.forEach(u => {
    const matchMod = (mId === 'ALL' || u.moduleId === mId);
    const matchTopic = (!tId || tId === 'ALL' || u.topicId === tId);
    if (matchMod && matchTopic && !seenUnits.has(u.unitId)) {
      seenUnits.add(u.unitId);
      unitSelect.add(new Option(`[${u.unitId}] ${u.unitName}`, u.unitId));
    }
  });
}
</script>

<template id="template-oral">
  <div class="page-header">
    <div class="page-title">
      <h2>口試模擬問答</h2>
      <p>模擬學會證照口試。由 Gemini 考官出題，並在作答後從「完整度、正確性、邏輯、深度」四維度進行臨床評分。</p>
    </div>
  </div>
  
  <div class="grid-cols-3">
    <!-- 左邊：口試進行區 -->
    <div class="glass-card" style="grid-column: span 2; display: flex; flex-direction: column; min-height: 520px; justify-content: space-between;">
      <!-- 1. 設定與開始口試 -->
      <div id="oral-setup-box" style="display: flex; flex-direction: column; gap: 1.5rem; justify-content: center; height: 100%;">
        <div style="text-align: center; margin-bottom: 1.5rem;">
          <span class="material-icons-round" style="font-size: 4rem; color: var(--secondary);">forum</span>
          <h3 style="margin-top: 1rem;">開啟 AI 口試問答</h3>
          <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">選擇您想挑戰的學科與題型，進行口語組織練習。</p>
        </div>
        
        <div class="grid-cols-2">
          <div class="form-group">
            <label class="form-label" for="oral-mod-select">考科模組</label>
            <select id="oral-mod-select"></select>
          </div>
          <div class="form-group">
            <label class="form-label" for="oral-type-select">題型分類</label>
            <select id="oral-type-select">
              <option value="clinical" selected>臨床情境題 (緊急處置/異常品管)</option>
              <option value="concept">基本理論與概念解釋</option>
              <option value="comparison">不同技術/協定比較分析</option>
              <option value="calculation">核心公式與劑量口頭推導</option>
              <option value="regulation">輻射防護設計與安全法規</option>
            </select>
          </div>
        </div>
        
        <button id="btn-start-oral" class="btn btn-accent" style="width: 100%; margin-top: 1rem;">
          <span class="material-icons-round">bolt</span>
          <span>生成口試題目</span>
        </button>
      </div>
      
      <!-- 2. 口試問答中 -->
      <div id="oral-active-box" style="display: none; flex-direction: column; gap: 1.5rem; flex-grow: 1;">
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem;">
          <span style="font-weight: 700; color: var(--secondary);">AI 考官提問</span>
          <span class="badge badge-review" id="active-oral-type">臨床情境</span>
        </div>
        
        <!-- 題目內容 -->
        <div id="active-oral-question" style="font-size: 1.15rem; font-weight: 600; line-height: 1.6; padding: 1rem; background: rgba(255,255,255,0.02); border-radius: 12px; border: 1px solid var(--border-color);" class="markdown-view">
          考題生成中...
        </div>
        
        <!-- 作答區 -->
        <div class="form-group" style="flex-grow: 1; display: flex; flex-direction: column;">
          <label class="form-label" for="oral-user-answer">請在此輸入您的回答口述內容（建議思考後分段條列回答）：</label>
          <textarea id="oral-user-answer" style="flex-grow: 1; min-height: 180px; resize: vertical;" class="form-control" placeholder="輸入您的作答內容，例如：\n1. 我會先確認游離腔... \n2. 接著依據 TG-51 協定..."></textarea>
        </div>
        
        <div style="display: flex; gap: 0.75rem; justify-content: flex-end;">
          <button class="btn btn-secondary" onclick="showOralSetup()">放棄此題</button>
          <button id="btn-submit-oral" class="btn btn-primary">
            <span class="material-icons-round">send</span>
            <span>提交口試答案</span>
          </button>
        </div>
      </div>
      
      <!-- 3. 口試評分結果與檢討 -->
      <div id="oral-report-box" style="display: none; flex-direction: column; gap: 1.5rem;">
        <div class="card-header" style="padding-bottom: 0.5rem; margin-bottom: 0.5rem;">
          <h3 class="card-title">
            <span class="material-icons-round" style="color: var(--success);">fact_check</span>
            <span>口試診斷報告</span>
          </h3>
        </div>
        
        <!-- 口試題目與我的作答 -->
        <div class="glass-card" style="background: rgba(255, 255, 255, 0.02); padding: 1.25rem; border: 1px solid var(--border-color); display: flex; flex-direction: column; gap: 0.85rem;">
          <div>
            <div style="font-size: 0.85rem; color: var(--secondary); font-weight: 700; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.25rem;">
              <span class="material-icons-round" style="font-size: 1.2rem;">question_answer</span>
              <span>口試題目</span>
            </div>
            <div id="oral-report-question" style="font-size: 1.05rem; font-weight: 600; line-height: 1.6; color: var(--text-main);" class="markdown-view">
              題目載入中...
            </div>
          </div>
          
          <div style="border-top: 1px solid rgba(255,255,255,0.06); padding-top: 0.85rem;">
            <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 700; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.25rem;">
              <span class="material-icons-round" style="font-size: 1.2rem;">person</span>
              <span>我的作答</span>
            </div>
            <div id="oral-report-user-answer" style="font-size: 0.95rem; color: var(--text-muted); line-height: 1.6; white-space: pre-wrap; background: rgba(0, 0, 0, 0.2); padding: 1rem; border-radius: 8px; border: 1px solid rgba(255,255,255,0.03);">
              作答內容載入中...
            </div>
          </div>
        </div>
        
        <div class="grid-cols-2" style="gap: 1rem;">
          <!-- 分數看板 -->
          <div class="glass-card" style="background: rgba(255,255,255,0.02); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem;">
            <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">綜合評分</div>
            <div id="oral-report-score" style="font-size: 3.5rem; font-weight: 800; color: var(--success); line-height: 1;">0</div>
            
            <div style="width: 100%; display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.75rem; color: var(--text-muted); margin-top: 1rem;">
              <div style="display: flex; justify-content: space-between;"><span>完整度 (Completeness):</span> <span id="oral-score-comp" style="font-weight:bold;">0/25</span></div>
              <div style="display: flex; justify-content: space-between;"><span>正確性 (Accuracy):</span> <span id="oral-score-acc" style="font-weight:bold;">0/25</span></div>
              <div style="display: flex; justify-content: space-between;"><span>邏輯性 (Logic):</span> <span id="oral-score-log" style="font-weight:bold;">0/25</span></div>
              <div style="display: flex; justify-content: space-between;"><span>理論深度 (Depth):</span> <span id="oral-score-depth" style="font-weight:bold;">0/25</span></div>
            </div>
          </div>
          
          <!-- 缺漏關鍵點 -->
          <div class="glass-card" style="background: rgba(255,255,255,0.02); padding: 1.25rem;">
            <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600; margin-bottom: 0.5rem;">答覆中缺漏的關鍵概念</div>
            <ul id="oral-missing-points" style="font-size: 0.8rem; color: var(--text-muted); padding-left: 1.25rem; display: flex; flex-direction: column; gap: 0.35rem;">
              <!-- 缺漏要點 -->
            </ul>
          </div>
        </div>
        
        <!-- 評語回饋 -->
        <div>
          <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-bottom: 0.4rem;">考官評語與改進建議</div>
          <div id="oral-report-feedback" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; background: rgba(255,255,255,0.01); border: 1px solid var(--border-color); padding: 1rem; border-radius: 8px; white-space: pre-wrap;" class="markdown-view">評語載入中...</div>
        </div>
        
        <!-- 考官參考答案 -->
        <div style="border-top: 1px solid var(--border-color); padding-top: 1rem;">
          <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600; margin-bottom: 0.4rem;">考官推薦之標準回覆結構與參考答案</div>
          <div id="oral-report-ref-ans" style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5; background: rgba(138,43,226,0.05); border: 1px solid rgba(138,43,226,0.2); padding: 1rem; border-radius: 8px; white-space: pre-wrap;" class="markdown-view">參考答案載入中...</div>
        </div>
        
        <button class="btn btn-primary" onclick="showOralSetup()" style="width: 100%;">
          <span>返回進行下一題挑戰</span>
        </button>
      </div>
    </div>
    
    <!-- 右邊：歷史練習紀錄 -->
    <div class="glass-card" style="grid-column: span 1; display: flex; flex-direction: column; min-width: 0; overflow: hidden;">
      <div class="card-header">
        <h3 class="card-title">
          <span class="material-icons-round">question_answer</span>
          <span>口試練習記錄</span>
        </h3>
      </div>
      <div id="oral-history-container" style="display: flex; flex-direction: column; gap: 0.75rem; max-height: 480px; overflow-y: auto; padding-right: 0.25rem;">
        <!-- 動態載入口試歷史 -->
        <div style="text-align: center; color: var(--text-dark); padding: 2rem;">無練習記錄</div>
      </div>
    </div>
  </div>
</template>

<script>
let currentOralQuestion = null;

/**
 * 載入口試模擬頁面
 */
async function loadOralPage() {
  const syllabus = await API.getSyllabus();
  if (window.location.hash.substring(1) !== 'oral') return;
  const modules = [...new Set(syllabus.map(u => u.moduleId))];
  const modSelect = document.getElementById('oral-mod-select');
  modSelect.innerHTML = '';
  modules.forEach(m => {
    modSelect.add(new Option(m, m));
  });
  
  // 綁定開始口試按鈕
  document.getElementById('btn-start-oral').onclick = startOralQuestion;
  // 綁定答案提交按鈕
  document.getElementById('btn-submit-oral').onclick = submitOralAnswerAction;
  
  // 載入歷史記錄
  loadOralHistory();
}

/**
 * 開始取得口試題目
 */
async function startOralQuestion() {
  const btn = document.getElementById('btn-start-oral');
  const moduleId = document.getElementById('oral-mod-select').value;
  const questionType = document.getElementById('oral-type-select').value;
  
  btn.disabled = true;
  showToast('AI 考官正在擬定題目，這大約需要 10-15 秒...', 'info');
  
  try {
    currentOralQuestion = await API.getNewOralQuestion(moduleId, questionType);
    
    // UI 切換
    document.getElementById('oral-setup-box').style.display = 'none';
    document.getElementById('oral-report-box').style.display = 'none';
    document.getElementById('oral-active-box').style.display = 'flex';
    document.getElementById('oral-user-answer').value = '';
    
    // 設定題目
    const typeNames = {
      clinical: '臨床情境題', concept: '基本概念解釋', 
      comparison: '對比分析', calculation: '核心公式推導', regulation: '輻防與法規'
    };
    document.getElementById('active-oral-type').innerText = typeNames[questionType] || '口試題目';
    document.getElementById('active-oral-question').innerHTML = currentOralQuestion.question;
    
    showToast('考官已出題，請認真回答！', 'success');
  } catch (err) {
    showToast('出題失敗：' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

/**
 * 提交作答
 */
async function submitOralAnswerAction() {
  const btn = document.getElementById('btn-submit-oral');
  const userAnswer = document.getElementById('oral-user-answer').value;
  
  if (!userAnswer || userAnswer.trim() === '') {
    showToast('請先輸入您的回答內容！', 'warning');
    return;
  }
  
  btn.disabled = true;
  showToast('AI 考官正在審查您的回答，正在評分...', 'info');
  
  try {
    const res = await API.submitOralAnswer(
      currentOralQuestion.moduleId,
      currentOralQuestion.questionType,
      currentOralQuestion.question,
      currentOralQuestion.referenceAnswer,
      userAnswer
    );
    
    // 切換至報告
    document.getElementById('oral-active-box').style.display = 'none';
    document.getElementById('oral-report-box').style.display = 'flex';
    
    // 渲染報告內容
    document.getElementById('oral-report-score').innerText = res.score;
    document.getElementById('oral-score-comp').innerText = `${res.completeness}/25`;
    document.getElementById('oral-score-acc').innerText = `${res.accuracy}/25`;
    document.getElementById('oral-score-log').innerText = `${res.logic}/25`;
    document.getElementById('oral-score-depth').innerText = `${res.depth}/25`;
    document.getElementById('oral-report-feedback').innerHTML = res.feedback;
    document.getElementById('oral-report-ref-ans').innerHTML = res.referenceAnswer;
    document.getElementById('oral-report-question').innerHTML = currentOralQuestion.question;
    document.getElementById('oral-report-user-answer').innerText = userAnswer;
    
    // 填充缺失點
    const missingUl = document.getElementById('oral-missing-points');
    missingUl.innerHTML = '';
    if (res.missingPoints && res.missingPoints.length > 0) {
      res.missingPoints.forEach(pt => {
        const li = document.createElement('li');
        li.innerText = pt;
        missingUl.appendChild(li);
      });
    } else {
      missingUl.innerHTML = '<li style="color: var(--success); list-style-type: none; margin-left: -1rem;"><span class="material-icons-round" style="font-size: 1rem; vertical-align: middle;">done</span> 核心要點全數答對</li>';
    }
    
    showToast('考官完成審核評分！', 'success');
  } catch(err) {
    showToast('提交失敗：' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

/**
 * 載入歷史記錄
 */
async function loadOralHistory() {
  const container = document.getElementById('oral-history-container');
  container.innerHTML = '';
  
  try {
    const history = await API.getOralPractices();
    if (history.length === 0) {
      container.innerHTML = '<div style="text-align: center; color: var(--text-dark); padding: 2rem;">無練習記錄</div>';
      return;
    }
    
    history.forEach(h => {
      const card = document.createElement('div');
      card.className = 'glass-card';
      card.style.padding = '1rem';
      card.style.background = 'rgba(255,255,255,0.01)';
      card.style.border = '1px solid var(--border-color)';
      card.style.cursor = 'pointer';
      
      const typeNames = {
        clinical: '臨床情境', concept: '概念解釋', 
        comparison: '對比分析', calculation: '公式推導', regulation: '輻防法規'
      };
      
      card.innerHTML = `
        <div style="display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.4rem;">
          <span>${h.date} (${h.moduleId})</span>
          <span style="font-weight: 700; color: var(--success);">${h.aiScore}分</span>
        </div>
        <div style="font-size: 0.85rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-main);">
          Q: ${h.question}
        </div>
        <div style="font-size: 0.7rem; color: var(--text-dark); margin-top: 0.25rem;">
          題型: ${typeNames[h.questionType] || h.questionType}
        </div>
      `;
      
      card.onclick = () => {
        // 在主視窗中重播該題的評分報告
        document.getElementById('oral-setup-box').style.display = 'none';
        document.getElementById('oral-active-box').style.display = 'none';
        document.getElementById('oral-report-box').style.display = 'flex';
        
        document.getElementById('oral-report-score').innerText = h.aiScore;
        document.getElementById('oral-score-comp').innerText = `${h.aiFeedback.completeness || 0}/25`;
        document.getElementById('oral-score-acc').innerText = `${h.aiFeedback.accuracy || 0}/25`;
        document.getElementById('oral-score-log').innerText = `${h.aiFeedback.logic || 0}/25`;
        document.getElementById('oral-score-depth').innerText = `${h.aiFeedback.depth || 0}/25`;
        document.getElementById('oral-report-feedback').innerHTML = h.aiFeedback.feedback || '';
        document.getElementById('oral-report-ref-ans').innerHTML = h.referenceAnswer;
        document.getElementById('oral-report-question').innerHTML = h.question;
        document.getElementById('oral-report-user-answer').innerText = h.userAnswer || '';
        
        // 填充缺失點
        const missingUl = document.getElementById('oral-missing-points');
        missingUl.innerHTML = '';
        if (h.aiFeedback.missingPoints && h.aiFeedback.missingPoints.length > 0) {
          h.aiFeedback.missingPoints.forEach(pt => {
            const li = document.createElement('li');
            li.innerText = pt;
            missingUl.appendChild(li);
          });
        } else {
          missingUl.innerHTML = '<li style="color: var(--success); list-style-type: none; margin-left: -1rem;"><span class="material-icons-round" style="font-size: 1rem; vertical-align: middle;">done</span> 核心要點全數答對</li>';
        }
        
        renderMath();
      };
      
      container.appendChild(card);
    });
  } catch(e) {}
}

function showOralSetup() {
  document.getElementById('oral-report-box').style.display = 'none';
  document.getElementById('oral-active-box').style.display = 'none';
  document.getElementById('oral-setup-box').style.display = 'flex';
  loadOralHistory();
}
</script>

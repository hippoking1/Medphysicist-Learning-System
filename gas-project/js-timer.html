<script>
/**
 * 全局學習計時與測驗計時器 (js-timer.html)
 */

const StudyTimer = {
  intervalId: null,
  startTime: null,
  elapsedSeconds: 0,
  isPaused: false,
  currentUnitId: null,
  currentUnitName: null,

  start(unitId, unitName) {
    if (this.intervalId) {
      showToast('已有其他單元正在進行計時！', 'warning');
      return;
    }
    
    this.currentUnitId = unitId;
    this.currentUnitName = unitName;
    this.startTime = new Date();
    this.elapsedSeconds = 0;
    this.isPaused = false;
    
    // 顯示浮動計時面版
    document.getElementById('timer-unit-name').innerText = unitName;
    document.getElementById('floating-timer').style.display = 'flex';
    this.updateDisplay();
    
    // 設定按鈕事件
    document.getElementById('btn-timer-pause').onclick = () => this.togglePause();
    document.getElementById('btn-timer-stop').onclick = () => this.stopAndSave();
    
    this.intervalId = setInterval(() => {
      if (!this.isPaused) {
        this.elapsedSeconds++;
        this.updateDisplay();
      }
    }, 1000);
    
    showToast(`開始學習：${unitName}`, 'info');
  },
  
  togglePause() {
    this.isPaused = !this.isPaused;
    const btn = document.getElementById('btn-timer-pause');
    if (this.isPaused) {
      btn.innerHTML = '<span class="material-icons-round" style="font-size: 1rem;">play_arrow</span>';
      showToast('計時暫停', 'info');
    } else {
      btn.innerHTML = '<span class="material-icons-round" style="font-size: 1rem;">pause</span>';
      showToast('計時恢復', 'info');
    }
  },
  
  updateDisplay() {
    const hrs = Math.floor(this.elapsedSeconds / 3600);
    const mins = Math.floor((this.elapsedSeconds % 3600) / 60);
    const secs = this.elapsedSeconds % 60;
    
    const formatted = [
      String(hrs).padStart(2, '0'),
      String(mins).padStart(2, '0'),
      String(secs).padStart(2, '0')
    ].join(':');
    
    document.getElementById('timer-time').innerText = formatted;
  },
  
  async stopAndSave() {
    clearInterval(this.intervalId);
    this.intervalId = null;
    document.getElementById('floating-timer').style.display = 'none';
    
    const elapsedMinutes = Math.max(1, Math.round(this.elapsedSeconds / 60));
    
    // 開啟儲存進度對話框 (以 Prompt 或動態 Modal)
    // 這裡我們直接寫入一個簡單的 Prompt/互動，為了維持極佳體驗，可用 HTML Modal
    const confirmSave = confirm(`學習結束！本次累計學習 ${elapsedMinutes} 分鐘。\n是否要將此時數記入 [${this.currentUnitName}] 的進度？`);
    
    if (confirmSave) {
      const notes = prompt('請輸入本次學習筆記（選填）：', '');
      const status = confirm('是否要將本單元標記為「已完成」(Completed)？\n(取消則標記為「進行中」)') ? 'completed' : 'in_progress';
      
      try {
        showToast('正在儲存進度...', 'info');
        await API.updateProgress(this.currentUnitId, status, elapsedMinutes, notes || '');
        showToast('學習進度已成功儲存！', 'success');
        
        // 若當前在 syllabus 頁面，刷新資料
        if (window.location.hash === '#syllabus') {
          loadSyllabusPage();
        } else if (window.location.hash === '#dashboard') {
          loadDashboardPage();
        }
      } catch (err) {
        showToast('進度儲存失敗：' + err.message, 'error');
      }
    } else {
      showToast('計時已取消，未儲存時數', 'warning');
    }
  }
};

/**
 * 模擬測驗計時器物件
 */
class ExamTimer {
  constructor(durationSeconds, onTick, onTimeUp) {
    this.duration = durationSeconds;
    this.elapsed = 0;
    this.onTick = onTick;
    this.onTimeUp = onTimeUp;
    this.intervalId = null;
    this.isStopped = false;
  }
  
  start() {
    this.intervalId = setInterval(() => {
      if (this.isStopped) return;
      this.elapsed++;
      const remaining = this.duration - this.elapsed;
      
      this.onTick(remaining, this.elapsed);
      
      if (remaining <= 0) {
        this.stop();
        this.onTimeUp();
      }
    }, 1000);
  }
  
  stop() {
    this.isStopped = true;
    if (this.intervalId) {
      clearInterval(this.intervalId);
      this.intervalId = null;
    }
  }
}
</script>

<template id="template-settings">
  <div class="page-header">
    <div class="page-title">
      <h2>系統設定</h2>
      <p>管理您的個人備考參數、資料庫初始化與 API 連線金鑰</p>
    </div>
  </div>
  
  <div class="grid-cols-2">
    <!-- 備考參數設定 -->
    <div class="glass-card">
      <div class="card-header">
        <h3 class="card-title">
          <span class="material-icons-round">edit_calendar</span>
          <span>個人學習參數</span>
        </h3>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="input-exam-date">預計考試日期</label>
        <input type="date" id="input-exam-date" class="form-control">
      </div>
      
      <div class="form-group">
        <label class="form-label" for="input-start-date">學習計劃開始日</label>
        <input type="date" id="input-start-date" class="form-control">
      </div>
      
      <div class="form-group">
        <label class="form-label" for="input-daily-goal">每日學習目標 (分鐘)</label>
        <input type="number" id="input-daily-goal" class="form-control" min="15" max="480">
      </div>
      
      <div class="form-group">
        <label class="form-label" for="input-notebook-url">NotebookLM 筆記本網址</label>
        <input type="url" id="input-notebook-url" class="form-control" placeholder="https://notebooklm.google.com/notebook/...">
      </div>
      
      <button id="btn-save-params" class="btn btn-primary" style="width: 100%;">
        <span class="material-icons-round">save</span>
        <span>儲存設定</span>
      </button>
    </div>
    
    <!-- Gemini API 設定 -->
    <div class="glass-card">
      <div class="card-header">
        <h3 class="card-title">
          <span class="material-icons-round">api</span>
          <span>Gemini AI 連線設定</span>
        </h3>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="input-api-key">Gemini API Key</label>
        <input type="password" id="input-api-key" class="form-control" placeholder="輸入您的 Gemini API 金鑰 (例如: AIzaSy...)">
        <p style="font-size: 0.75rem; color: var(--text-dark); margin-top: 0.25rem;">
          此金鑰將安全儲存在您的 Google Sheets 中。
        </p>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="select-model">AI 模型</label>
        <select id="select-model">
          <option value="gemini-3.5-flash" selected>gemini-3.5-flash (最新推薦: 高速精準)</option>
          <option value="gemini-2.0-flash">gemini-2.0-flash (推薦: 高速且省量)</option>
          <option value="gemini-2.0-pro-exp-02-05">gemini-2.0-pro (高精確複雜推導)</option>
          <option value="gemini-1.5-flash">gemini-1.5-flash</option>
        </select>
      </div>
      
      <button id="btn-save-ai" class="btn btn-accent" style="width: 100%;">
        <span class="material-icons-round">bolt</span>
        <span>儲存並測試 API 連線</span>
      </button>
    </div>
  </div>
  
  <!-- 資料庫維護 -->
  <div class="glass-card" style="margin-top: 1.5rem; border-color: rgba(255, 23, 68, 0.2);">
    <div class="card-header">
      <h3 class="card-title" style="color: #ff5252;">
        <span class="material-icons-round">dangerous</span>
        <span>資料庫維護與重置</span>
      </h3>
    </div>
    <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">
      如果這是您第一次使用本系統，或者不小心手動破壞了 Google Sheets，請點擊下方按鈕進行資料表結構初始化，這會建立所有必要的資料表與預設的學術課綱。<b>(注意：此動作不會清除您已有的學習進度與歷程，若工作表已存在僅會補齊欄位)</b>
    </p>
    <button id="btn-init-db" class="btn btn-danger">
      <span class="material-icons-round">restart_alt</span>
      <span>初始化 / 修復資料庫結構</span>
    </button>
  </div>
</template>

<script>
/**
 * 載入設定頁面與綁定邏輯
 */
async function loadSettingsPage() {
  const examDateInput = document.getElementById('input-exam-date');
  const startDateInput = document.getElementById('input-start-date');
  const dailyGoalInput = document.getElementById('input-daily-goal');
  const notebookUrlInput = document.getElementById('input-notebook-url');
  const apiKeyInput = document.getElementById('input-api-key');
  const modelSelect = document.getElementById('select-model');
  
  const btnSaveParams = document.getElementById('btn-save-params');
  const btnSaveAI = document.getElementById('btn-save-ai');
  const btnInitDB = document.getElementById('btn-init-db');
  
  // 1. 讀取現有設定
  try {
    const examDate = await API.getConfig('examDate');
    const startDate = await API.getConfig('startDate');
    const dailyGoal = await API.getConfig('dailyGoalMinutes') || '45';
    const notebookUrl = await API.getConfig('notebookLmUrl');
    const apiKey = await API.getConfig('geminiApiKey');
    const model = await API.getConfig('geminiModel') || 'gemini-2.0-flash';
    
    examDateInput.value = examDate;
    startDateInput.value = startDate;
    dailyGoalInput.value = dailyGoal;
    notebookUrlInput.value = notebookUrl;
    apiKeyInput.value = apiKey;
    modelSelect.value = model;
  } catch(e) {
    showToast('讀取設定檔失敗，請先點擊下方初始化資料庫！', 'error');
  }
  
  // 2. 綁定「儲存個人參數」
  btnSaveParams.onclick = async () => {
    btnSaveParams.disabled = true;
    try {
      await API.saveConfig('examDate', examDateInput.value);
      await API.saveConfig('startDate', startDateInput.value);
      await API.saveConfig('dailyGoalMinutes', dailyGoalInput.value);
      await API.saveConfig('notebookLmUrl', notebookUrlInput.value);
      showToast('備考學習參數已儲存！', 'success');
    } catch (e) {
      showToast('儲存失敗：' + e.message, 'error');
    } finally {
      btnSaveParams.disabled = false;
    }
  };
  
  // 3. 綁定「儲存 Gemini AI 金鑰」
  btnSaveAI.onclick = async () => {
    btnSaveAI.disabled = true;
    try {
      await API.saveConfig('geminiApiKey', apiKeyInput.value);
      await API.saveConfig('geminiModel', modelSelect.value);
      
      // 測試連線 (嘗試呼叫 API 看看)
      showToast('正在驗證 API 金鑰...', 'info');
      // 嘗試生成一個簡單的測試，若無錯誤代表成功
      // 這裡不直接做出題呼叫，僅存檔後通知，因呼叫需耗費 API Token
      showToast('連線設定已儲存！', 'success');
    } catch (e) {
      showToast('連線測試失敗：' + e.message, 'error');
    } finally {
      btnSaveAI.disabled = false;
    }
  };
  
  // 4. 綁定「資料庫初始化」
  btnInitDB.onclick = async () => {
    if (!confirm('您確定要初始化/修復試算表嗎？\n此動作會為您建立 Syllabus、Progress 等 8 張工作表並填寫課綱。')) return;
    btnInitDB.disabled = true;
    try {
      showToast('正在初始化資料庫，這可能需要幾秒鐘...', 'info');
      const res = await API.initializeSheets();
      showToast(res.message || '資料庫建置成功！', 'success');
      // 重新載入設定
      loadSettingsPage();
    } catch (e) {
      showToast('初始化失敗：' + e.message, 'error');
    } finally {
      btnInitDB.disabled = false;
    }
  };
}
</script>

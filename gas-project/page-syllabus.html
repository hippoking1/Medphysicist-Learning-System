<template id="template-syllabus">
  <div class="page-header">
    <div class="page-title">
      <h2>學習課綱與進度規劃</h2>
      <p>涵蓋 10 大學術領域、37 個學習單元與 30 份精選考照文獻。在此啟動學習計時器或維護筆記。</p>
    </div>
  </div>
  
  <div class="glass-card" style="margin-bottom: 2rem;">
    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;" id="syllabus-module-tabs">
      <!-- 模組切換 Tab 按鈕 -->
      <button class="btn btn-primary tab-btn active" data-mod="ALL">全部模組</button>
      <button class="btn btn-secondary tab-btn" data-mod="M1">M1 基礎物理</button>
      <button class="btn btn-secondary tab-btn" data-mod="M2">M2 劑量學</button>
      <button class="btn btn-secondary tab-btn" data-mod="M3">M3 治療計劃</button>
      <button class="btn btn-secondary tab-btn" data-mod="M4">M4 特殊技術</button>
      <button class="btn btn-secondary tab-btn" data-mod="M5">M5 品質保證</button>
      <button class="btn btn-secondary tab-btn" data-mod="M6">M6 影像QC</button>
      <button class="btn btn-secondary tab-btn" data-mod="M7">M7 輻防安全</button>
      <button class="btn btn-secondary tab-btn" data-mod="M8">M8 基礎醫學</button>
      <button class="btn btn-secondary tab-btn" data-mod="M9">M9 放射生物</button>
      <button class="btn btn-secondary tab-btn" data-mod="M10">M10 電腦概論</button>
    </div>
  </div>
  
  <div id="syllabus-list" style="display: flex; flex-direction: column; gap: 1.5rem;">
    <!-- 課綱清單動態載入區 -->
    <div class="loader-container">
      <div class="spinner"></div>
      <div class="loading-text">載入課綱進度中...</div>
    </div>
  </div>
  
  <!-- 彈出視窗：手動更新進度/筆記 -->
  <dialog id="progress-modal" class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h3 id="modal-title">更新學習進度</h3>
        <span class="modal-close" onclick="closeProgressModal()">&times;</span>
      </div>
      <input type="hidden" id="modal-unit-id">
      
      <div class="form-group">
        <label class="form-label" for="modal-status">學習狀態</label>
        <select id="modal-status">
          <option value="not_started">未開始 (Not Started)</option>
          <option value="in_progress">進行中 (In Progress)</option>
          <option value="completed">已完成 (Completed)</option>
          <option value="review">需要複習 (Need Review)</option>
        </select>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="modal-add-minutes">手動新增學習時間 (分鐘)</label>
        <input type="number" id="modal-add-minutes" class="form-control" value="0" min="0">
      </div>
      
      <div class="form-group">
        <label class="form-label" for="modal-notes">研讀筆記與重點摘要</label>
        <textarea id="modal-notes" rows="6" class="form-control" placeholder="請在此記錄您的讀書筆記、公式推導摘要或重要筆記..."></textarea>
      </div>
      
      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
        <button class="btn btn-secondary" onclick="closeProgressModal()">取消</button>
        <button id="btn-submit-modal" class="btn btn-primary">儲存變更</button>
      </div>
    </div>
  </dialog>

  <!-- 彈出視窗：AI 生成複習卡 -->
  <dialog id="ai-card-modal" class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h3>AI 快速生成知識卡片</h3>
        <span class="modal-close" onclick="closeAICardModal()">&times;</span>
      </div>
      <input type="hidden" id="ai-modal-mod-id">
      <input type="hidden" id="ai-modal-unit-id">
      
      <div class="form-group">
        <label class="form-label">請貼上文獻重點段落或您的讀書摘要：</label>
        <textarea id="ai-card-text" rows="8" class="form-control" placeholder="貼上文獻內容（英文亦可，AI 會翻譯並提煉重點）...例如：The TG-51 protocol for clinical reference dosimetry of high energy photon beams specifies that the calibration must be done in water..."></textarea>
      </div>
      
      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
        <button class="btn btn-secondary" onclick="closeAICardModal()">取消</button>
        <button id="btn-submit-ai-card" class="btn btn-accent">
          <span class="material-icons-round">bolt</span>
          <span>生成複習卡</span>
        </button>
      </div>
    </div>
  </dialog>

  <!-- 彈出視窗：NotebookLM 學習與範圍內容整理 -->
  <dialog id="notebooklm-modal" class="modal-dialog">
    <div class="modal-content" style="max-width: 700px; display: flex; flex-direction: column; max-height: 85vh;">
      <div class="modal-header">
        <h3 id="notebooklm-modal-title">NotebookLM 學習提示詞</h3>
        <span class="modal-close" onclick="closeNotebookLMModal()">&times;</span>
      </div>
      
      <div style="flex-grow: 1; overflow-y: auto; margin-bottom: 1.5rem;">
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1rem;">
          請複製下方專門為此單元優化的 **AI 提示詞**，然後點選右下角按鈕前往您的 NotebookLM 筆記本。在對話框中貼上此提示詞，即可讓 NotebookLM 根據您所上傳的 PDF 檔案生成最精確的內容整理與公式推導。
        </p>
        
        <div class="form-group">
          <label class="form-label">單元專屬 NotebookLM 提示詞：</label>
          <textarea id="notebooklm-prompt-text" rows="12" class="form-control" style="font-family: inherit; font-size: 0.9rem; line-height: 1.5; background: var(--bg-primary); border-color: var(--primary);" readonly></textarea>
        </div>
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 1rem;">
        <button class="btn btn-primary" onclick="copyNotebookLMPrompt()">
          <span class="material-icons-round">content_copy</span>
          <span>複製提示詞</span>
        </button>
        <div style="display: flex; gap: 0.75rem;">
          <button class="btn btn-secondary" onclick="closeNotebookLMModal()">關閉</button>
          <a id="btn-open-notebooklm" class="btn btn-accent" target="_blank" href="#" style="text-decoration: none;">
            <span class="material-icons-round">open_in_new</span>
            <span>前往 NotebookLM 筆記本</span>
          </a>
        </div>
      </div>
    </div>
  </dialog>

  <!-- 彈出視窗：隨堂測驗 -->
  <dialog id="unit-quiz-modal" class="modal-dialog">
    <div class="modal-content" style="max-width: 700px; display: flex; flex-direction: column; max-height: 85vh;">
      <div class="modal-header">
        <h3 id="quiz-modal-title">隨堂測驗</h3>
        <span class="modal-close" onclick="closeUnitQuizModal()">&times;</span>
      </div>
      
      <div id="quiz-modal-body" style="flex-grow: 1; overflow-y: auto; padding-right: 0.5rem; margin-bottom: 1.5rem;">
        <!-- 測驗題目動態渲染區 -->
      </div>
      
      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; border-top: 1px solid var(--border-color); padding-top: 1rem;" id="quiz-modal-footer">
        <button class="btn btn-secondary" onclick="closeUnitQuizModal()">關閉</button>
        <button id="btn-submit-unit-quiz" class="btn btn-primary">提交測驗</button>
      </div>
    </div>
  </dialog>
</template>

<script>
let currentActiveMod = 'ALL';
let allSyllabusProgress = [];

/**
 * 載入課綱頁面邏輯
 */
async function loadSyllabusPage() {
  allSyllabusProgress = await API.getProgress();
  
  // 檢查是否有跳轉定位的目標
  let hasScrollTarget = false;
  if (window.pendingSyllabusScrollTarget) {
    const targetUnit = allSyllabusProgress.find(u => u.unitId === window.pendingSyllabusScrollTarget);
    if (targetUnit) {
      currentActiveMod = targetUnit.moduleId;
      hasScrollTarget = true;
    }
  }
  
  renderSyllabusList();
  
  // 綁定 Tab 切換
  const tabs = document.querySelectorAll('.tab-btn');
  tabs.forEach(tab => {
    // 若有跳轉目標，重設一開始 Tab 的 active 狀態
    if (hasScrollTarget) {
      const targetUnit = allSyllabusProgress.find(u => u.unitId === window.pendingSyllabusScrollTarget);
      if (tab.getAttribute('data-mod') === targetUnit.moduleId) {
        tab.classList.remove('btn-secondary');
        tab.classList.add('btn-primary', 'active');
      } else {
        tab.classList.remove('btn-primary', 'active');
        tab.classList.add('btn-secondary');
      }
    }
    
    tab.onclick = () => {
      tabs.forEach(t => {
        t.classList.remove('btn-primary', 'active');
        t.classList.add('btn-secondary');
      });
      tab.classList.remove('btn-secondary');
      tab.classList.add('btn-primary', 'active');
      currentActiveMod = tab.getAttribute('data-mod');
      renderSyllabusList();
    };
  });
  
  // 執行定位與高亮
  if (hasScrollTarget) {
    const targetId = window.pendingSyllabusScrollTarget;
    window.pendingSyllabusScrollTarget = null; // 立即清除
    setTimeout(() => {
      const element = document.getElementById(`unit-row-${targetId}`);
      if (element) {
        element.scrollIntoView({ behavior: 'smooth', block: 'center' });
        element.classList.add('unit-highlight');
        setTimeout(() => {
          element.classList.remove('unit-highlight');
        }, 4500); // 配合 CSS 4.5秒後自動移除 class
      }
    }, 150);
  }
}

/**
 * 渲染課綱清單
 */
function renderSyllabusList() {
  const container = document.getElementById('syllabus-list');
  container.innerHTML = '';
  
  // 篩選
  const filtered = currentActiveMod === 'ALL' 
    ? allSyllabusProgress 
    : allSyllabusProgress.filter(u => u.moduleId === currentActiveMod);
    
  if (filtered.length === 0) {
    container.innerHTML = '<div class="glass-card" style="text-align: center;">沒有符合的學習單元。</div>';
    return;
  }
  
  // 依模組分群繪製
  let currentModId = '';
  let modCard = null;
  let modUnitsContainer = null;
  
  filtered.forEach(unit => {
    if (unit.moduleId !== currentModId) {
      currentModId = unit.moduleId;
      
      // 建立模組的外層卡片
      modCard = document.createElement('div');
      modCard.className = 'glass-card';
      modCard.innerHTML = `
        <div class="card-header" style="margin-bottom: 1.5rem;">
          <h3 class="card-title" style="color: var(--secondary);">
            <span class="material-icons-round">folder</span>
            <span>${unit.moduleId} - ${unit.moduleName}</span>
          </h3>
        </div>
      `;
      
      modUnitsContainer = document.createElement('div');
      modUnitsContainer.style.display = 'flex';
      modUnitsContainer.style.flexDirection = 'column';
      modUnitsContainer.style.gap = '1.25rem';
      
      modCard.appendChild(modUnitsContainer);
      container.appendChild(modCard);
    }
    
    // 建立學習單元區塊
    const unitDiv = document.createElement('div');
    unitDiv.id = `unit-row-${unit.unitId}`;
    unitDiv.style.borderLeft = `3px solid ${getStatusColor(unit.status)}`;

    unitDiv.style.paddingLeft = '1rem';
    unitDiv.style.display = 'flex';
    unitDiv.style.justifyContent = 'space-between';
    unitDiv.style.alignItems = 'center';
    unitDiv.style.background = 'rgba(255,255,255,0.01)';
    unitDiv.style.padding = '0.75rem 1rem';
    unitDiv.style.borderRadius = '0 10px 10px 0';
    unitDiv.style.border = '1px solid var(--border-color)';
    unitDiv.style.borderLeftWidth = '3px';
    unitDiv.style.borderLeftColor = getStatusColor(unit.status);
    
    const badgeClass = `badge badge-${unit.status === 'in_progress' ? 'progress' : unit.status}`;
    const statusTextMap = {
      not_started: '未開始',
      in_progress: '進行中',
      completed: '已完成',
      review: '需複習'
    };
    
    unitDiv.innerHTML = `
      <div style="flex-grow: 1; max-width: 75%;">
        <div style="display: flex; align-items: center; gap: 0.75rem;">
          <span style="font-weight: 700; color: var(--text-main);">${unit.unitId}</span>
          <span style="font-weight: 600; font-size: 0.95rem;">${unit.unitName}</span>
          <span class="${badgeClass}">${statusTextMap[unit.status]}</span>
          <span class="badge badge-todo">第 ${unit.plannedWeek} 週</span>
        </div>
        <div style="font-size: 0.75rem; color: var(--text-muted); margin-top: 0.4rem;">
          <b>文獻:</b> ${unit.literature} (章節: ${unit.chapters})
        </div>
        ${unit.notes ? `
          <div style="font-size: 0.8rem; color: var(--text-dark); background: rgba(255,255,255,0.02); padding: 0.5rem; border-radius: 6px; margin-top: 0.5rem; font-style: italic;">
            <b>筆記:</b> ${unit.notes.substring(0, 150)}${unit.notes.length > 150 ? '...' : ''}
          </div>
        ` : ''}
      </div>
      
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <div style="text-align: right; margin-right: 0.75rem; font-size: 0.75rem; color: var(--text-muted);">
          <div>預估: ${unit.estimatedMinutes}m</div>
          <div style="color: var(--secondary);">累計: ${unit.totalMinutes}m</div>
        </div>
        
        <!-- 開始計時 -->
        <button class="btn btn-secondary" onclick="StudyTimer.start('${unit.unitId}', '${unit.unitName}')" style="padding: 0.5rem;" title="啟動學習計時">
          <span class="material-icons-round" style="font-size: 1.2rem; color: var(--success);">play_arrow</span>
        </button>
        
        <!-- 編輯筆記/進度 -->
        <button class="btn btn-secondary" onclick="openProgressModal('${unit.unitId}', '${unit.unitName}', '${unit.status}', ${unit.totalMinutes}, \`${encodeURIComponent(unit.notes || '')}\`)" style="padding: 0.5rem;" title="編輯進度與筆記">
          <span class="material-icons-round" style="font-size: 1.2rem;">edit</span>
        </button>
        
        <!-- AI 生成複習卡 -->
        <button class="btn btn-secondary" onclick="openAICardModal('${unit.moduleId}', '${unit.unitId}')" style="padding: 0.5rem;" title="AI 生成複習卡">
          <span class="material-icons-round" style="font-size: 1.2rem; color: var(--secondary);">bolt</span>
        </button>
        
        <!-- NotebookLM 學習與整理 -->
        <button class="btn btn-secondary" onclick="openNotebookLMModal('${unit.unitId}', '${unit.unitName}')" style="padding: 0.5rem;" title="NotebookLM 學習與範圍內容整理">
          <span class="material-icons-round" style="font-size: 1.2rem; color: var(--info);">menu_book</span>
        </button>
        
        <!-- 隨堂測驗 -->
        <button class="btn btn-secondary" onclick="startUnitQuiz('${unit.unitId}', '${unit.moduleId}', '${unit.topicId}')" style="padding: 0.5rem;" title="隨堂小測驗">
          <span class="material-icons-round" style="font-size: 1.2rem; color: var(--primary);">quiz</span>
        </button>
      </div>
    `;
    
    modUnitsContainer.appendChild(unitDiv);
  });
}

function getStatusColor(status) {
  if (status === 'completed') return 'var(--success)';
  if (status === 'in_progress') return 'var(--info)';
  if (status === 'review') return 'var(--warning)';
  return 'var(--text-dark)';
}

// ==========================================
// 學習進度 Modal 邏輯
// ==========================================
function openProgressModal(unitId, unitName, status, totalMinutes, notesEncoded) {
  const modal = document.getElementById('progress-modal');
  document.getElementById('modal-unit-id').value = unitId;
  document.getElementById('modal-title').innerText = `編輯進度 — [${unitId}] ${unitName}`;
  document.getElementById('modal-status').value = status;
  document.getElementById('modal-add-minutes').value = 0;
  document.getElementById('modal-notes').value = decodeURIComponent(notesEncoded);
  
  modal.showModal();
  
  document.getElementById('btn-submit-modal').onclick = async () => {
    const btn = document.getElementById('btn-submit-modal');
    btn.disabled = true;
    
    const targetStatus = document.getElementById('modal-status').value;
    const minutes = document.getElementById('modal-add-minutes').value;
    const notes = document.getElementById('modal-notes').value;
    
    try {
      showToast('正在更新進度...', 'info');
      await API.updateProgress(unitId, targetStatus, minutes, notes);
      showToast('更新成功！', 'success');
      closeProgressModal();
      loadSyllabusPage(); // 刷新
    } catch(err) {
      showToast('更新失敗：' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  };
}

function closeProgressModal() {
  document.getElementById('progress-modal').close();
}

// ==========================================
// AI 複習卡 Modal 邏輯
// ==========================================
function openAICardModal(moduleId, unitId) {
  document.getElementById('ai-modal-mod-id').value = moduleId;
  document.getElementById('ai-modal-unit-id').value = unitId || '';
  document.getElementById('ai-card-text').value = '';
  document.getElementById('ai-card-modal').showModal();
  
  document.getElementById('btn-submit-ai-card').onclick = async () => {
    const btn = document.getElementById('btn-submit-ai-card');
    const text = document.getElementById('ai-card-text').value;
    if (!text || text.trim() === '') {
      showToast('請輸入文獻內容！', 'warning');
      return;
    }
    
    btn.disabled = true;
    try {
      showToast('Gemini AI 正在分析並提煉複習卡片...', 'info');
      const modId = document.getElementById('ai-modal-mod-id').value;
      const uId = document.getElementById('ai-modal-unit-id').value;
      const cards = await API.generateFlashcardsAI(modId, uId, text);
      showToast(`成功生成 ${cards.length} 張知識複習卡！`, 'success');
      closeAICardModal();
    } catch (err) {
      showToast('生成失敗：' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  };
}

function closeAICardModal() {
  document.getElementById('ai-card-modal').close();
}

// ==========================================
// NotebookLM 整合與提示詞生成邏輯
// ==========================================
async function openNotebookLMModal(unitId, unitName) {
  const modal = document.getElementById('notebooklm-modal');
  const title = document.getElementById('notebooklm-modal-title');
  const promptTextarea = document.getElementById('notebooklm-prompt-text');
  const openBtn = document.getElementById('btn-open-notebooklm');
  
  title.innerText = `[${unitId}] ${unitName} — NotebookLM 提示詞`;
  
  const unit = allSyllabusProgress.find(u => u.unitId === unitId);
  if (!unit) return;
  
  const promptContent = `請根據我上傳的文獻資料（主要針對 ${unit.literature}，尤其是「${unit.chapters}」相關章節），為我詳細整理【[${unit.unitId}] ${unit.unitName}】的學習內容。

請依據文獻的實際內容，依照以下結構進行整理：
1. 【核心物理觀念與定義】：說明此單元最基礎的物理原理與物理量定義。
2. 【核心計算公式與參數】：整理並列出所有必考的計算公式、公式中各代號的物理意義、常用常數。公式請使用標準 LaTeX 格式（例如：\\(D_{w,Q} = M \\cdot N_{D,w} \\cdot k_Q\\)）。
3. 【指引與規範 (如 AAPM TG 或 IAEA TRS)】：針對文獻中的具體品管項目、頻率、容許差值（Tolerances）、實驗配置進行詳細條列整理。
4. 【臨床情境與實務口試要點】：本單元在臨床實務上的重點與口試常問考點。`;
  
  promptTextarea.value = promptContent;
  
  // 設定 NotebookLM 連結
  try {
    const notebookUrl = await API.getConfig('notebookLmUrl');
    if (notebookUrl && notebookUrl.trim() !== '') {
      openBtn.href = notebookUrl;
      openBtn.onclick = null; // 重置點擊事件
      openBtn.style.display = 'inline-flex';
    } else {
      openBtn.href = '#';
      openBtn.onclick = (e) => {
        e.preventDefault();
        showToast('請先至「系統設定」頁面填寫您的 NotebookLM 筆記本網址！', 'warning');
      };
    }
  } catch(e) {
    openBtn.style.display = 'none';
  }
  
  modal.showModal();
}

function closeNotebookLMModal() {
  document.getElementById('notebooklm-modal').close();
}

function copyNotebookLMPrompt() {
  const promptTextarea = document.getElementById('notebooklm-prompt-text');
  const text = promptTextarea.value;
  if (!text) {
    showToast('無提示詞可複製！', 'warning');
    return;
  }
  
  navigator.clipboard.writeText(text)
    .then(() => {
      showToast('單元專屬提示詞已複製！請貼入 NotebookLM 中。', 'success');
    })
    .catch(err => {
      showToast('複製失敗：' + err.message, 'error');
    });
}

// ==========================================
// 隨堂測驗 (Unit Quiz) 控制邏輯
// ==========================================
let currentQuizQs = [];
let quizUserAnswers = {}; // index -> selected option

async function startUnitQuiz(unitId, moduleId, topicId) {
  // 從已加載的學習進度資料中尋找匹配的單元名稱
  const unit = allSyllabusProgress.find(u => u.unitId === unitId);
  const unitName = unit ? unit.unitName : '';
  
  const modal = document.getElementById('unit-quiz-modal');
  const title = document.getElementById('quiz-modal-title');
  const body = document.getElementById('quiz-modal-body');
  const submitBtn = document.getElementById('btn-submit-unit-quiz');
  
  title.innerText = `[${unitId}] ${unitName} — 隨堂測驗`;
  body.innerHTML = `<div class="loader-container"><div class="spinner"></div><div class="loading-text">考官正在挑選或生成隨堂測驗題目，這可能需要 10-15 秒，請稍候...</div></div>`;
  submitBtn.style.display = 'inline-flex';
  submitBtn.disabled = true;
  
  modal.showModal();
  
  quizUserAnswers = {};
  currentQuizQs = [];
  
  try {
    // 傳送這三個參數，以便在後端精準按單元進行篩選與出題
    const res = await API.getUnitQuiz(unitId, moduleId, topicId);
    currentQuizQs = Array.isArray(res) ? res : [];
    
    if (currentQuizQs.length === 0) {
      body.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 2rem;">題庫中尚無此範圍的題目，且 AI 自動出題失敗。請稍候再試。</div>`;
      return;
    }
    
    renderQuizQuestions();
    submitBtn.disabled = false;
  } catch (err) {
    body.innerHTML = `<div style="color: var(--danger); text-align: center; padding: 2rem;">取得題目失敗: ${err.message}</div>`;
  }
}

function renderQuizQuestions() {
  const body = document.getElementById('quiz-modal-body');
  body.innerHTML = '';
  
  currentQuizQs.forEach((q, idx) => {
    const qDiv = document.createElement('div');
    qDiv.style.marginBottom = '2rem';
    qDiv.style.borderBottom = '1px solid var(--border-color)';
    qDiv.style.paddingBottom = '1.5rem';
    
    qDiv.innerHTML = `
      <div style="font-weight: 700; color: var(--secondary); margin-bottom: 0.5rem; font-size: 0.85rem;">第 ${idx + 1} 題 (難度 ${q.difficulty})</div>
      <div class="markdown-view" style="font-size: 0.95rem; font-weight: 500; margin-bottom: 1rem; white-space: pre-wrap;">${q.questionText}</div>
      <div class="quiz-options" id="quiz-q-${idx}-options">
        <!-- 4個選項 -->
      </div>
    `;
    body.appendChild(qDiv);
    
    // 渲染選項
    const optionsDiv = document.getElementById(`quiz-q-${idx}-options`);
    const options = [
      { key: 'A', text: q.optionA },
      { key: 'B', text: q.optionB },
      { key: 'C', text: q.optionC },
      { key: 'D', text: q.optionD }
    ];
    
    options.forEach(opt => {
      const optDiv = document.createElement('div');
      optDiv.className = 'quiz-option';
      optDiv.id = `quiz-q-${idx}-opt-${opt.key}`;
      optDiv.innerHTML = `
        <span class="option-letter">${opt.key}</span>
        <span>${opt.text}</span>
      `;
      optDiv.onclick = () => {
        // 如果已經提交了，就不能再點選
        if (document.getElementById('btn-submit-unit-quiz').style.display === 'none') return;
        
        quizUserAnswers[idx] = opt.key;
        // 清除該題其他選項的選取狀態
        options.forEach(o => {
          document.getElementById(`quiz-q-${idx}-opt-${o.key}`).classList.remove('selected');
        });
        optDiv.classList.add('selected');
      };
      optionsDiv.appendChild(optDiv);
    });
  });
  
  // 渲染公式與圖形
  renderMath();
  
  // 綁定提交按鈕事件
  document.getElementById('btn-submit-unit-quiz').onclick = submitUnitQuizAnswers;
}

function submitUnitQuizAnswers() {
  // 檢查是否所有題目都有回答
  const unanswered = currentQuizQs.filter((_, idx) => !quizUserAnswers[idx]);
  if (unanswered.length > 0) {
    showToast(`還有 ${unanswered.length} 題尚未作答！`, 'warning');
    return;
  }
  
  // 開始批改並顯示結果
  let correctCount = 0;
  
  currentQuizQs.forEach((q, idx) => {
    const userAns = quizUserAnswers[idx];
    const correctAns = q.correctAnswer;
    const isCorrect = userAns === correctAns;
    if (isCorrect) correctCount++;
    
    // 將所有選項的對錯高亮
    const options = ['A', 'B', 'C', 'D'];
    options.forEach(optKey => {
      const optDiv = document.getElementById(`quiz-q-${idx}-opt-${optKey}`);
      if (optKey === correctAns) {
        optDiv.classList.add('correct'); // 綠色
      } else if (optKey === userAns && !isCorrect) {
        optDiv.classList.add('wrong'); // 紅色
      }
    });
    
    // 插入解析區塊
    const qOptionsDiv = document.getElementById(`quiz-q-${idx}-options`);
    const expDiv = document.createElement('div');
    expDiv.style.background = 'rgba(138,43,226,0.06)';
    expDiv.style.padding = '0.75rem';
    expDiv.style.borderRadius = '8px';
    expDiv.style.borderLeft = '3px solid var(--primary)';
    expDiv.style.fontSize = '0.85rem';
    expDiv.style.marginTop = '0.75rem';
    
    expDiv.innerHTML = `
      <div style="font-weight: 700; color: var(--text-main); margin-bottom: 0.25rem;">
        正確答案: <span style="color: var(--success);">${correctAns}</span>
        <span style="font-weight: normal; font-size: 0.75rem; color: var(--text-dark); margin-left: 0.5rem;">(出處: ${q.sourceRef})</span>
      </div>
      <div style="color: var(--text-muted); font-size: 0.8rem; line-height: 1.5; white-space: pre-wrap;" class="markdown-view">${q.explanation}</div>
    `;
    qOptionsDiv.parentNode.appendChild(expDiv);
  });
  
  // 顯示分數
  showToast(`測驗完成！您答對了 ${correctCount} / ${currentQuizQs.length} 題`, 'success');
  
  // 隱藏提交按鈕
  document.getElementById('btn-submit-unit-quiz').style.display = 'none';
  
  // 重新渲染公式與圖形
  renderMath();
}

function closeUnitQuizModal() {
  document.getElementById('unit-quiz-modal').close();
}
</script>

<script>
/**
 * HTML5 Canvas 輕量級高質感圖表引擎 (js-charts.html)
 * 支援環形進度圖、趨勢折線圖、以及模組分析雷達圖
 */

const Charts = {
  /**
   * 繪製圓環進度圖 (Donut Progress Chart)
   */
  drawDonut(canvasId, percent, labelText = '完成度') {
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    
    // 響應式與高解析度適配
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const radius = Math.min(cx, cy) - 15;
    
    ctx.clearRect(0, 0, rect.width, rect.height);
    
    // 1. 繪製背景灰環
    ctx.beginPath();
    ctx.arc(cx, cy, radius, 0, 2 * Math.PI);
    ctx.strokeStyle = '#1b1c26';
    ctx.lineWidth = 10;
    ctx.stroke();
    
    // 2. 繪製漸層進度環
    if (percent > 0) {
      ctx.beginPath();
      // 從 12 點鐘方向開始 (-Math.PI/2)
      const endAngle = -Math.PI / 2 + (2 * Math.PI * (percent / 100));
      ctx.arc(cx, cy, radius, -Math.PI / 2, endAngle);
      
      const grad = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      grad.addColorStop(0, '#8a2be2'); // violet
      grad.addColorStop(1, '#00f2fe'); // cyan
      
      ctx.strokeStyle = grad;
      ctx.lineWidth = 12;
      ctx.lineCap = 'round';
      ctx.stroke();
    }
    
    // 3. 繪製中心數字與文字
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    ctx.fillStyle = '#f5f6fa';
    ctx.font = '700 24px "Outfit", sans-serif';
    ctx.fillText(`${percent}%`, cx, cy - 5);
    
    ctx.fillStyle = '#a0a5c1';
    ctx.font = '500 11px "Noto Sans TC", sans-serif';
    ctx.fillText(labelText, cx, cy + 18);
  },

  /**
   * 繪製學習時數折線圖 (Line Trend Chart)
   */
  drawLine(canvasId, dataPoints) {
    // dataPoints: [{date: '07-05', minutes: 30}, ...]
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    
    ctx.clearRect(0, 0, rect.width, rect.height);
    
    if (dataPoints.length === 0) return;
    
    const padding = { top: 20, right: 20, bottom: 30, left: 35 };
    const chartWidth = rect.width - padding.left - padding.right;
    const chartHeight = rect.height - padding.top - padding.bottom;
    
    const maxVal = Math.max(60, ...dataPoints.map(p => p.minutes));
    
    // 1. 繪製背景水平參考線
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#6c7293';
    ctx.font = '10px monospace';
    ctx.textAlign = 'right';
    
    const gridCount = 4;
    for (let i = 0; i <= gridCount; i++) {
      const yVal = Math.round((maxVal / gridCount) * i);
      const y = padding.top + chartHeight - (chartHeight * (yVal / maxVal));
      
      ctx.beginPath();
      ctx.moveTo(padding.left, y);
      ctx.lineTo(padding.left + chartWidth, y);
      ctx.stroke();
      
      ctx.fillText(`${yVal}m`, padding.left - 8, y + 3);
    }
    
    // 2. 計算並點繪曲線
    const points = dataPoints.map((dp, i) => {
      const x = padding.left + (chartWidth * (i / (dataPoints.length - 1)));
      const y = padding.top + chartHeight - (chartHeight * (dp.minutes / maxVal));
      return { x, y, ...dp };
    });
    
    // 3. 繪製折線與漸層填滿
    if (points.length > 1) {
      // 繪製線條
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.strokeStyle = '#00f2fe';
      ctx.lineWidth = 3;
      ctx.stroke();
      
      // 繪製下方漸層填滿
      ctx.beginPath();
      ctx.moveTo(points[0].x, padding.top + chartHeight);
      for (let i = 0; i < points.length; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }
      ctx.lineTo(points[points.length - 1].x, padding.top + chartHeight);
      ctx.closePath();
      
      const grad = ctx.createLinearGradient(0, padding.top, 0, padding.top + chartHeight);
      grad.addColorStop(0, 'rgba(0, 242, 254, 0.2)');
      grad.addColorStop(1, 'rgba(0, 242, 254, 0)');
      ctx.fillStyle = grad;
      ctx.fill();
    }
    
    // 4. 繪製端點與 X 軸文字
    ctx.textAlign = 'center';
    ctx.fillStyle = '#a0a5c1';
    points.forEach((p, i) => {
      // 節點圓點
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, 2 * Math.PI);
      ctx.fillStyle = '#00f2fe';
      ctx.fill();
      ctx.strokeStyle = '#0a0b10';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      
      // 繪製 X 軸日期
      ctx.fillStyle = '#a0a5c1';
      ctx.font = '10px monospace';
      ctx.fillText(p.date, p.x, padding.top + chartHeight + 18);
    });
  },

  /**
   * 繪製弱點分析雷達圖 (Radar Chart)
   */
  drawRadar(canvasId, moduleRates) {
    // moduleRates: { M1: 85, M2: 60, ... } 0-100 的正確率
    const canvas = document.getElementById(canvasId);
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    
    ctx.clearRect(0, 0, rect.width, rect.height);
    
    const cx = rect.width / 2;
    const cy = rect.height / 2;
    const maxRadius = Math.min(cx, cy) - 35;
    
    const axes = ['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7'];
    const totalAxes = axes.length;
    
    // 1. 繪製五角/七角同心網格 (20%, 40%, 60%, 80%, 100%)
    const gridLevels = 5;
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    
    for (let level = 1; level <= gridLevels; level++) {
      const radius = maxRadius * (level / gridLevels);
      ctx.beginPath();
      for (let i = 0; i < totalAxes; i++) {
        const angle = (i * 2 * Math.PI / totalAxes) - Math.PI / 2;
        const x = cx + radius * Math.cos(angle);
        const y = cy + radius * Math.sin(angle);
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.stroke();
    }
    
    // 2. 繪製放射軸與標題
    ctx.fillStyle = '#6c7293';
    ctx.font = '700 10px "Outfit", sans-serif';
    
    for (let i = 0; i < totalAxes; i++) {
      const angle = (i * 2 * Math.PI / totalAxes) - Math.PI / 2;
      const xOuter = cx + maxRadius * Math.cos(angle);
      const yOuter = cy + maxRadius * Math.sin(angle);
      
      // 放射線
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(xOuter, yOuter);
      ctx.stroke();
      
      // 軸標題排版
      const textX = cx + (maxRadius + 15) * Math.cos(angle);
      const textY = cy + (maxRadius + 12) * Math.sin(angle);
      
      if (Math.abs(Math.cos(angle)) < 0.1) ctx.textAlign = 'center';
      else if (Math.cos(angle) > 0) ctx.textAlign = 'left';
      else ctx.textAlign = 'right';
      
      ctx.fillText(axes[i], textX, textY + 3);
    }
    
    // 3. 繪製數據多邊形
    const dataPoints = axes.map((axis, i) => {
      const rate = moduleRates[axis] !== undefined ? moduleRates[axis] : 0;
      const radius = maxRadius * (rate / 100);
      const angle = (i * 2 * Math.PI / totalAxes) - Math.PI / 2;
      return {
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle)
      };
    });
    
    ctx.beginPath();
    ctx.moveTo(dataPoints[0].x, dataPoints[0].y);
    for (let i = 1; i < totalAxes; i++) {
      ctx.lineTo(dataPoints[i].x, dataPoints[i].y);
    }
    ctx.closePath();
    
    // 漸層填滿
    ctx.fillStyle = 'rgba(138, 43, 226, 0.35)';
    ctx.fill();
    ctx.strokeStyle = '#8a2be2';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // 4. 繪製資料點小圓圈
    dataPoints.forEach(p => {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.5, 0, 2 * Math.PI);
      ctx.fillStyle = '#00f2fe';
      ctx.fill();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  }
};
</script>

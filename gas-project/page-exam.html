<template id="template-exam">
  <div class="page-header">
    <div class="page-title">
      <h2>模擬測驗中心</h2>
      <p>模擬正式物理師認證筆試，全範圍模擬考為 80 題單選（60分鐘）。支援即時交卷、自動診斷與弱點雷達圖分析。</p>
    </div>
  </div>
  
  <!-- 1. 測驗設定與歷史紀錄 -->
  <div id="exam-setup-view" class="grid-cols-3">
    <!-- 建立新測驗 -->
    <div class="glass-card" style="grid-column: span 1;">
      <div class="card-header">
        <h3 class="card-title">
          <span class="material-icons-round">post_add</span>
          <span>開啟新測驗</span>
        </h3>
      </div>
      
      <div class="form-group">
        <label class="form-label" for="exam-type-select">測驗類型</label>
        <select id="exam-type-select">
          <option value="full" selected>全範圍模擬考 (80題/60分鐘)</option>
          <option value="module">單一模組驗收測驗 (20題/30分鐘)</option>
        </select>
      </div>
      
      <div class="form-group" id="exam-mod-group" style="display: none;">
        <label class="form-label" for="exam-mod-select">選擇要測驗的模組</label>
        <select id="exam-mod-select"></select>
      </div>
      
      <button id="btn-start-exam" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
        <span class="material-icons-round">play_lesson</span>
        <span>開始測驗</span>
      </button>
    </div>
    
    <!-- 歷史成績記錄 -->
    <div class="glass-card" style="grid-column: span 2;">
      <div class="card-header">
        <h3 class="card-title">
          <span class="material-icons-round">history</span>
          <span>歷次模擬考成績</span>
        </h3>
      </div>
      <div class="table-responsive" style="max-height: 250px; overflow-y: auto;">
        <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem;" id="table-exam-history">
          <thead>
            <tr style="border-bottom: 2px solid var(--border-color); color: var(--text-muted);">
              <th style="padding: 0.5rem 0.25rem;">日期</th>
              <th style="padding: 0.5rem 0.25rem;">類型</th>
              <th style="padding: 0.5rem 0.25rem;">答對數</th>
              <th style="padding: 0.5rem 0.25rem;">分數</th>
              <th style="padding: 0.5rem 0.25rem;">耗時</th>
            </tr>
          </thead>
          <tbody id="exam-history-tbody">
            <!-- 動態載入歷史 -->
            <tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--text-dark);">無測驗記錄</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
  
  <!-- 2. 測驗進行中視圖 -->
  <div id="exam-active-view" class="grid-cols-4" style="display: none; margin-top: 1rem;">
    <!-- 左邊：題目導覽與計時 -->
    <div class="glass-card" style="grid-column: span 1; height: fit-content; display: flex; flex-direction: column; gap: 1.25rem;">
      <div style="text-align: center;">
        <div style="font-size: 0.8rem; color: var(--text-muted); font-weight: 500;">剩餘時間</div>
        <div id="active-exam-timer" style="font-size: 2rem; font-weight: 700; font-family: monospace; color: var(--secondary);">00:00</div>
      </div>
      
      <div style="border-top: 1px solid var(--border-color); padding-top: 1rem;">
        <div style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.75rem; font-weight: 500;">答題狀態 (<span id="exam-nav-completed">0</span>/<span id="exam-nav-total">0</span>)</div>
        <div id="exam-nav-grid" style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 0.5rem; max-height: 250px; overflow-y: auto;">
          <!-- 題目圓圈按鈕 -->
        </div>
      </div>
      
      <button id="btn-submit-exam" class="btn btn-danger" style="width: 100%;">
        <span class="material-icons-round">check_circle</span>
        <span>提前交卷</span>
      </button>
    </div>
    
    <!-- 右邊：主題目區區塊 -->
    <div class="glass-card" style="grid-column: span 3; display: flex; flex-direction: column; justify-content: space-between; min-height: 450px;">
      <div>
        <div style="display: flex; justify-content: space-between; border-bottom: 1px solid var(--border-color); padding-bottom: 0.75rem; margin-bottom: 1.5rem;">
          <span style="font-weight: 700; color: var(--primary);">第 <span id="active-q-index">1</span> 題</span>
          <span class="badge badge-todo" style="font-size: 0.7rem;">難度 <span id="active-q-diff">1</span></span>
        </div>
        
        <div id="active-q-text" class="markdown-view" style="font-size: 1.1rem; font-weight: 500; margin-bottom: 2rem; white-space: pre-wrap;">
          載入題目中...
        </div>
        
        <div class="quiz-options" id="active-q-options">
          <!-- 4 個選項 -->
        </div>
      </div>
      
      <div style="display: flex; justify-content: space-between; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
        <button id="btn-prev-q" class="btn btn-secondary">
          <span class="material-icons-round">arrow_back</span>
          <span>上一題</span>
        </button>
        <button id="btn-next-q" class="btn btn-primary">
          <span>下一題</span>
          <span class="material-icons-round">arrow_forward</span>
        </button>
      </div>
    </div>
  </div>
  
  <!-- 3. 測驗結果與診斷報告 -->
  <div id="exam-results-view" class="grid-cols-3" style="display: none; margin-top: 1rem;">
    <!-- 左邊：核心分數與雷達圖 -->
    <div class="glass-card" style="grid-column: span 1; display: flex; flex-direction: column; align-items: center; gap: 1.5rem;">
      <div style="text-align: center;">
        <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500;">測驗分數</div>
        <div id="results-score" style="font-size: 4rem; font-weight: 800; color: var(--success); line-height: 1.1;">0</div>
        <div style="font-size: 0.8rem; color: var(--text-dark); margin-top: 0.25rem;">答對 <span id="results-correct-count">0</span> / <span id="results-total-count">0</span> 題</div>
      </div>
      
      <div style="width: 100%; border-top: 1px solid var(--border-color); padding-top: 1rem; text-align: center;">
        <div style="font-size: 0.85rem; color: var(--text-muted); font-weight: 500; margin-bottom: 0.75rem;">模組分析雷達圖</div>
        <div style="width: 100%; height: 200px; display: flex; align-items: center; justify-content: center;">
          <canvas id="canvas-exam-radar" style="width: 180px; height: 180px;"></canvas>
        </div>
      </div>
      
      <button class="btn btn-primary" onclick="showSetupView()" style="width: 100%;">
        <span class="material-icons-round">restart_alt</span>
        <span>返回測驗中心</span>
      </button>
    </div>
    
    <!-- 右邊：錯題解析清單 -->
    <div class="glass-card" style="grid-column: span 2; display: flex; flex-direction: column; gap: 1.5rem;">
      <div class="card-header">
        <h3 class="card-title">
          <span class="material-icons-round">check_circle_outline</span>
          <span>錯題與解析報告</span>
        </h3>
      </div>
      
      <div id="exam-error-list" style="display: flex; flex-direction: column; gap: 1.5rem; max-height: 450px; overflow-y: auto; padding-right: 0.5rem;">
        <!-- 錯題清單 -->
      </div>
    </div>
  </div>
</template>

<script>
let currentExamQs = [];
let examUserAnswers = {}; // questionId -> selectedOption
let activeQIndex = 0;
let examTimerInstance = null;
let currentExamType = 'full';
let currentExamModule = '';

/**
 * 載入測驗頁面
 */
async function loadExamPage() {
  // 1. 初始化模組選擇器 (供模組驗收測驗選取)
  const syllabus = await API.getSyllabus();
  if (window.location.hash.substring(1) !== 'exam') return;
  const modules = [...new Set(syllabus.map(u => u.moduleId))];
  const modSelect = document.getElementById('exam-mod-select');
  modSelect.innerHTML = '';
  modules.forEach(m => {
    modSelect.add(new Option(m, m));
  });
  
  // 2. 監聽測驗類型切換
  const typeSelect = document.getElementById('exam-type-select');
  typeSelect.onchange = () => {
    document.getElementById('exam-mod-group').style.display = typeSelect.value === 'module' ? 'block' : 'none';
  };
  
  // 3. 綁定「開始測驗」按鈕
  document.getElementById('btn-start-exam').onclick = startExam;
  
  // 4. 讀取並渲染歷史成績
  loadExamHistory();

  // 5. 綁定上一題/下一題與提前交卷 (必須在這裡綁定，因為此時 DOM 已被渲染)
  document.getElementById('btn-prev-q').onclick = () => {
    if (activeQIndex > 0) showQuestion(activeQIndex - 1);
  };
  document.getElementById('btn-next-q').onclick = () => {
    if (activeQIndex < currentExamQs.length - 1) showQuestion(activeQIndex + 1);
  };
  document.getElementById('btn-submit-exam').onclick = () => {
    const answered = Object.keys(examUserAnswers).filter(k => examUserAnswers[k]).length;
    const unanswered = currentExamQs.length - answered;
    
    let confirmStr = '您確定要交卷嗎？';
    if (unanswered > 0) {
      confirmStr = `您還有 ${unanswered} 題尚未回答，確定要提前交卷嗎？`;
    }
    
    if (confirm(confirmStr)) {
      submitExamAction();
    }
  };
}

/**
 * 載入歷史成績紀錄
 */
async function loadExamHistory() {
  const tbody = document.getElementById('exam-history-tbody');
  tbody.innerHTML = '';
  
  try {
    const history = await API.getExamResults();
    if (window.location.hash.substring(1) !== 'exam') return;
    if (history.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; padding: 2rem; color: var(--text-dark);">無測驗記錄</td></tr>`;
      return;
    }
    
    history.forEach(h => {
      const tr = document.createElement('tr');
      tr.style.borderBottom = '1px solid var(--border-color)';
      
      const typeText = h.examType === 'full' ? '全範圍模擬' : '模組測驗';
      const duration = `${Math.floor(h.timeSpent / 60)}分${h.timeSpent % 60}秒`;
      const scoreStyle = h.score >= 60 ? 'color: var(--success); font-weight: 700;' : 'color: var(--danger); font-weight: 700;';
      
      tr.innerHTML = `
        <td style="padding: 0.65rem 0.25rem; color: var(--text-muted);">${h.date}</td>
        <td style="padding: 0.65rem 0.25rem;">${typeText}</td>
        <td style="padding: 0.65rem 0.25rem; color: var(--text-muted);">${h.correctCount} / ${h.totalQuestions}</td>
        <td style="padding: 0.65rem 0.25rem; ${scoreStyle}">${h.score} 分</td>
        <td style="padding: 0.65rem 0.25rem; color: var(--text-muted);">${duration}</td>
      `;
      tbody.appendChild(tr);
    });
  } catch(e) {}
}

/**
 * 開始測驗
 */
async function startExam() {
  const typeSelect = document.getElementById('exam-type-select');
  currentExamType = typeSelect.value;
  currentExamModule = document.getElementById('exam-mod-select').value;
  
  const btn = document.getElementById('btn-start-exam');
  btn.disabled = true;
  
  try {
    showToast('正在為您組卷中...', 'info');
    currentExamQs = await API.generateExam(currentExamType, currentExamModule);
    
    if (currentExamQs.length === 0) {
      throw new Error('未取得任何題目');
    }
    
    // 初始化作答狀態
    examUserAnswers = {};
    activeQIndex = 0;
    
    // 進入測驗進行中視圖
    document.getElementById('exam-setup-view').style.display = 'none';
    document.getElementById('exam-results-view').style.display = 'none';
    document.getElementById('exam-active-view').style.display = 'grid';
    
    // 啟動計時器 (模擬考60分，模組考30分)
    const durationSeconds = currentExamType === 'full' ? 3600 : 1800;
    initExamTimer(durationSeconds);
    
    // 初始化題數導覽網格
    initExamNavGrid();
    
    // 載入第一題
    showQuestion(0);
    
    showToast('測驗已開始，祝您好運！', 'success');
  } catch(err) {
    showToast('組卷失敗：' + err.message, 'error');
  } finally {
    btn.disabled = false;
  }
}

/**
 * 初始化測驗計時器
 */
function initExamTimer(durationSeconds) {
  const display = document.getElementById('active-exam-timer');
  
  if (examTimerInstance) examTimerInstance.stop();
  
  examTimerInstance = new ExamTimer(
    durationSeconds,
    (remaining, elapsed) => {
      const mins = Math.floor(remaining / 60);
      const secs = remaining % 60;
      display.innerText = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      
      // 當低於 5 分鐘，文字變紅警告
      if (remaining <= 300) {
        display.style.color = 'var(--danger)';
      } else {
        display.style.color = 'var(--secondary)';
      }
    },
    () => {
      showToast('測驗時間到！系統自動交卷...', 'warning');
      submitExamAction();
    }
  );
  
  examTimerInstance.start();
}

/**
 * 初始化側邊題目導覽網格
 */
function initExamNavGrid() {
  const grid = document.getElementById('exam-nav-grid');
  grid.innerHTML = '';
  
  document.getElementById('exam-nav-total').innerText = currentExamQs.length;
  updateNavCompletedCount();
  
  currentExamQs.forEach((q, idx) => {
    const btn = document.createElement('button');
    btn.className = 'btn btn-secondary';
    btn.style.padding = '0.35rem 0';
    btn.style.fontSize = '0.8rem';
    btn.style.borderRadius = '50%';
    btn.id = `exam-nav-btn-${idx}`;
    btn.innerText = idx + 1;
    btn.onclick = () => {
      activeQIndex = idx;
      showQuestion(activeQIndex);
    };
    grid.appendChild(btn);
  });
}

function updateNavCompletedCount() {
  const completed = Object.keys(examUserAnswers).filter(k => examUserAnswers[k]).length;
  document.getElementById('exam-nav-completed').innerText = completed;
}

/**
 * 載入指定索引題目
 */
function showQuestion(index) {
  if (index < 0 || index >= currentExamQs.length) return;
  activeQIndex = index;
  
  // 更新當前高亮與導航按鈕
  for (let i = 0; i < currentExamQs.length; i++) {
    const btn = document.getElementById(`exam-nav-btn-${i}`);
    if (btn) {
      btn.style.borderColor = 'var(--glass-border)';
      if (examUserAnswers[currentExamQs[i].questionId]) {
        btn.style.backgroundColor = 'var(--primary-light)';
        btn.style.color = 'var(--secondary)';
      } else {
        btn.style.backgroundColor = 'var(--glass-bg)';
        btn.style.color = 'var(--text-muted)';
      }
    }
  }
  
  const currentNavBtn = document.getElementById(`exam-nav-btn-${index}`);
  if (currentNavBtn) {
    currentNavBtn.style.borderColor = 'var(--secondary)';
    currentNavBtn.style.color = '#ffffff';
  }
  
  const q = currentExamQs[index];
  
  document.getElementById('active-q-index').innerText = index + 1;
  document.getElementById('active-q-diff').innerText = q.difficulty;
  document.getElementById('active-q-text').innerHTML = q.questionText;
  
  // 渲染選項
  const optionsDiv = document.getElementById('active-q-options');
  optionsDiv.innerHTML = '';
  
  const selected = examUserAnswers[q.questionId];
  
  const options = [
    { key: 'A', text: q.optionA },
    { key: 'B', text: q.optionB },
    { key: 'C', text: q.optionC },
    { key: 'D', text: q.optionD }
  ];
  
  options.forEach(opt => {
    const optDiv = document.createElement('div');
    optDiv.className = `quiz-option ${selected === opt.key ? 'selected' : ''}`;
    optDiv.innerHTML = `
      <span class="option-letter">${opt.key}</span>
      <span>${opt.text}</span>
    `;
    optDiv.onclick = () => {
      examUserAnswers[q.questionId] = opt.key;
      // 更新高亮
      document.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('selected'));
      optDiv.classList.add('selected');
      updateNavCompletedCount();
    };
    optionsDiv.appendChild(optDiv);
  });
  
  // 處理上下題按鈕狀態
  document.getElementById('btn-prev-q').disabled = index === 0;
  document.getElementById('btn-next-q').disabled = index === currentExamQs.length - 1;
  
  // 每次載入題目時手動排版公式
  renderMath();
}

// 這裡移除了原本在最外層的 onclick 綁定，改到 loadExamPage() 內進行綁定。

/**
 * 提交測驗至後端 API
 */
async function submitExamAction() {
  if (examTimerInstance) {
    examTimerInstance.stop();
  }
  
  const answersArr = currentExamQs.map(q => {
    return {
      questionId: q.questionId,
      selectedOption: examUserAnswers[q.questionId] || ''
    };
  });
  
  const timeSpent = examTimerInstance ? examTimerInstance.elapsed : 0;
  
  showToast('正在提交卷宗並計算成績...', 'info');
  document.getElementById('btn-submit-exam').disabled = true;
  
  try {
    const res = await API.submitExam(currentExamType, answersArr, timeSpent, currentExamModule);
    showToast('交卷成功，正在產出分析報告！', 'success');
    showResultsReport(res);
  } catch(err) {
    showToast('提交失敗：' + err.message, 'error');
  } finally {
    document.getElementById('btn-submit-exam').disabled = false;
  }
}

/**
 * 渲染測驗診斷報告
 */
function showResultsReport(res) {
  document.getElementById('exam-active-view').style.display = 'none';
  document.getElementById('exam-results-view').style.display = 'grid';
  
  document.getElementById('results-score').innerText = res.score;
  document.getElementById('results-correct-count').innerText = res.correctCount;
  document.getElementById('results-total-count').innerText = res.totalQuestions;
  
  // 繪製雷達圖
  const rates = {};
  const modules = ['M1', 'M2', 'M3', 'M4', 'M5', 'M6', 'M7'];
  modules.forEach(m => {
    rates[m] = res.moduleBreakdown[m] ? res.moduleBreakdown[m].rate : 0;
  });
  Charts.drawRadar('canvas-exam-radar', rates);
  
  // 填充錯題與解析
  const errorContainer = document.getElementById('exam-error-list');
  errorContainer.innerHTML = '';
  
  const wrongQs = res.details.filter(d => !d.isCorrect);
  
  if (wrongQs.length === 0) {
    errorContainer.innerHTML = `
      <div style="text-align: center; padding: 3rem; color: var(--success);">
        <span class="material-icons-round" style="font-size: 4rem;">emoji_events</span>
        <h4 style="margin-top: 1rem;">完美！您答對了所有題目</h4>
        <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 0.25rem;">這是極為罕見的佳績，繼續保持！</p>
      </div>
    `;
    return;
  }
  
  wrongQs.forEach((q, idx) => {
    const item = document.createElement('div');
    item.className = 'glass-card';
    item.style.background = 'rgba(255,255,255,0.01)';
    item.style.borderLeft = '3px solid var(--danger)';
    
    item.innerHTML = `
      <div style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; display: flex; justify-content: space-between;">
        <span>錯題 #${idx + 1} (${q.moduleId})</span>
        <span style="color: var(--text-dark);">文獻: ${q.sourceRef}</span>
      </div>
      <div style="font-weight: 500; font-size: 0.95rem; margin-bottom: 0.75rem; white-space: pre-wrap;" class="markdown-view">${q.questionText}</div>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem; font-size: 0.85rem; color: var(--text-dark); margin-bottom: 0.75rem;">
        <div style="${q.userAnswer === 'A' ? 'color: var(--danger); text-decoration: line-through;' : ''} ${q.correctAnswer === 'A' ? 'color: var(--success); font-weight: bold;' : ''}">A. ${q.optionA}</div>
        <div style="${q.userAnswer === 'B' ? 'color: var(--danger); text-decoration: line-through;' : ''} ${q.correctAnswer === 'B' ? 'color: var(--success); font-weight: bold;' : ''}">B. ${q.optionB}</div>
        <div style="${q.userAnswer === 'C' ? 'color: var(--danger); text-decoration: line-through;' : ''} ${q.correctAnswer === 'C' ? 'color: var(--success); font-weight: bold;' : ''}">C. ${q.optionC}</div>
        <div style="${q.userAnswer === 'D' ? 'color: var(--danger); text-decoration: line-through;' : ''} ${q.correctAnswer === 'D' ? 'color: var(--success); font-weight: bold;' : ''}">D. ${q.optionD}</div>
      </div>
      <div style="background: rgba(255, 23, 68, 0.05); padding: 0.75rem; border-radius: 8px; font-size: 0.85rem;">
        <div style="font-weight: 700; color: var(--text-main); margin-bottom: 0.25rem;">
          您的回答: <span style="color: var(--danger);">${q.userAnswer || '未作答'}</span> | 
          正確答案: <span style="color: var(--success);">${q.correctAnswer}</span>
        </div>
        <div style="color: var(--text-muted); font-size: 0.8rem; line-height: 1.5; white-space: pre-wrap;" class="markdown-view">${q.explanation}</div>
      </div>
    `;
    errorContainer.appendChild(item);
  });
  
  // 重新渲染公式
  renderMath();
}

function showSetupView() {
  document.getElementById('exam-results-view').style.display = 'none';
  document.getElementById('exam-setup-view').style.display = 'grid';
  loadExamHistory(); // 刷新歷史
}
</script>

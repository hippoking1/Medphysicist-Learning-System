name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inject Firebase Config from GitHub Secrets
        env:
          FIREBASE_CONFIG_RAW: ${{ secrets.FIREBASE_CONFIG }}
        run: |
          node << 'EOF'
          const fs = require('fs');
          const raw = (process.env.FIREBASE_CONFIG_RAW || '').trim();
          if (!raw) {
            console.log('FIREBASE_CONFIG secret is not set; skipping injection.');
            process.exit(0);
          }
          const keys = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
          const cfg = {};
          for (const k of keys) {
            const re = new RegExp(`["']?${k}["']?\\s*:\\s*["']([^"']+)["']`);
            const m = raw.match(re);
            if (m && m[1]) cfg[k] = m[1].trim();
          }
          if (!cfg.projectId || !cfg.apiKey) {
            console.error('Invalid FIREBASE_CONFIG secret: missing projectId or apiKey.');
            process.exit(1);
          }
          cfg.authDomain = cfg.authDomain || `${cfg.projectId}.firebaseapp.com`;
          cfg.storageBucket = cfg.storageBucket || `${cfg.projectId}.appspot.com`;
          const target = 'js/firebase-config.js';
          let src = fs.readFileSync(target, 'utf8');
          const pattern = /const DEFAULT_FIREBASE_CONFIG = \{[\s\S]*?\};/;
          if (!pattern.test(src)) {
            console.error('Could not find DEFAULT_FIREBASE_CONFIG placeholder in js/firebase-config.js');
            process.exit(1);
          }
          src = src.replace(pattern, `const DEFAULT_FIREBASE_CONFIG = ${JSON.stringify(cfg, null, 2)};`);
          fs.writeFileSync(target, src, 'utf8');
          console.log('Injected Firebase config for project:', cfg.projectId);
          EOF

      - name: Assemble clean static site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html .nojekyll _site/
          cp -r css js _site/
          if [ -d "考試範圍文獻資料" ]; then
            cp -r "考試範圍文獻資料" _site/
          fi
          ls -la _site

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
